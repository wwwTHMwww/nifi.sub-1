name: Auto Update

on:
  schedule:
    - cron: '*/30 * * * *'  # هر ۳۰ دقیقه
  workflow_dispatch:  # اجرای دستی

jobs:
  update:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          
      - name: Run update
        run: python src/main.py
        env:
          SOURCES: ${{ secrets.SOURCES }}
          
      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add output/sub.txt
          git diff --staged --quiet || git commit -m "Auto update $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          git push
